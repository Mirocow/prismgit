    <style>
      /* Loading screen — shown immediately on first paint, before React mounts.
         The renderer script takes ~200-500ms to load + parse + execute; during
         that gap, the user used to see a blank white screen. Now we show the
         PrismGit logo + a random feature tip that rotates every 4 seconds.

         Removed automatically when React renders the real App (App.tsx
         replaces #root's children).

         Theme matching: JavaScript below reads the saved theme from
         localStorage and sets --boot-bg / --boot-text / --boot-accent
         CSS variables to the active theme's colors. This way the boot
         screen matches whatever theme the user has chosen — no jarring
         "white screen → dark theme" or vice versa. If the saved theme
         isn't found, falls back to Ayu Dark (the app's default). */
      :root {
        --boot-bg: #0b0e14;
        --boot-text: #bfbdb6;
        --boot-text-dim: #8a8f98;
        --boot-accent: #39bae6;
        --boot-border: rgba(255, 255, 255, 0.08);
        --boot-tip-bg: rgba(255, 255, 255, 0.05);
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 200ms ease-out;
      }
      #boot-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .boot-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--boot-text);
        margin: 0;
      }
      .boot-subtitle {
        font-size: 11px;
        color: var(--boot-text-dim);
        margin: 0;
      }
      .boot-tip {
        max-width: 380px;
        min-height: 32px;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--boot-tip-bg);
        border: 1px solid var(--boot-border);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;

        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--boot-accent);
        margin-bottom: 4px;
        font-weight: 600;
      }

        width: 24px;
        height: 24px;
        border: 2px solid color-mix(in srgb, var(--boot-text) 15%, transparent);
        border-top-color: var(--boot-accent);
        border-radius: 50%;

        to { transform: rotate(360deg); }

  <body>
    <div id="root">
      <div id="boot-screen">
        <div class="boot-logo"></div>
        <div>
          <p class="boot-title">PrismGit</p>
          <p class="boot-subtitle">Modern Git client</p>
        </div>
        <div class="boot-spinner"></div>
        <div class="boot-tip" id="boot-tip">
          <div class="boot-tip-label">Did you know?</div>
          <div id="boot-tip-text">Loading…</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        // ── App logo data URI (same icon as build/icons/64x64.png) ──────────

              html += '<div style="font-size:12px;color:#f85149;margin-bottom:8px;font-weight:500;">' + (err.kind || 'Error') + ': ' + err.message + '</div>';
            } else {
              html += '<div style="font-size:12px;color:#8b949e;margin-bottom:8px;">No specific error was captured. This usually means a JavaScript bundle failed to load (network or build issue).</div>';
            }
            html += '<div style="background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;max-height:200px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,\'SF Mono\',Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;color:#e6edf3;margin-bottom:16px;">';
            html += err && err.stack ? err.stack.replace(/</g, '&lt;') : '(no stack trace available)';
            html += '</div>';
            html += '<div style="display:flex;gap:8px;justify-content:flex-end;">';
            html += '<button id="prismgit-copy-error" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px 14px;font-size:12px;cursor:pointer;">Copy error</button>';
            html += '<button id="prismgit-reload" style="background:#238636;color:white;border:none;border-radius:6px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:500;">Reload app</button>';
            html += '</div>';
            html += '</div>';
            bs.innerHTML = html;
            bs.style.alignItems = 'center';
            // Wire up the buttons.
            var copyBtn = document.getElementById('prismgit-copy-error');
            if (copyBtn) copyBtn.onclick = function () {
              var text = 'PrismGit Boot Error\n===================\n\n' + (err && err.message ? ('Kind: ' + (err.kind || 'unknown') + '\nMessage: ' + err.message + '\n\n') : '') + (err && err.stack ? ('Stack:\n' + err.stack) : '(no stack)');
              try { navigator.clipboard.writeText(text); copyBtn.textContent = 'Copied!'; setTimeout(function () { copyBtn.textContent = 'Copy error'; }, 2000); } catch (e) { /* ignore */ }
            };
            var reloadBtn = document.getElementById('prismgit-reload');
            if (reloadBtn) reloadBtn.onclick = function () {
              try { localStorage.removeItem('prismgit-last-error'); } catch (e) { /* ignore */ }
              window.location.reload();
            };
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/theme-init.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
